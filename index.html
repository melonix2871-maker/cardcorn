<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Puter Desktop - Google Cardboard</title>
    
    <!-- A-Frame with WebXR support -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Loading screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            font-family: 'Segoe UI', sans-serif;
            transition: opacity 1s;
        }
        
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* VR button */
        .enter-vr-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #4CAF50;
            color: white;
            border: 3px solid white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.7);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px #4CAF50; }
            50% { transform: scale(1.05); box-shadow: 0 0 40px #4CAF50; }
            100% { transform: scale(1); box-shadow: 0 0 20px #4CAF50; }
        }
        
        /* Instructions overlay (non-VR mode) */
        .instructions {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 150;
            border: 1px solid #4CAF50;
            pointer-events: none;
            white-space: nowrap;
        }
        
        /* Hide iframe when not in VR? (We'll handle with JS) */
        .iframe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none; /* So clicks pass through to VR button */
        }
        
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Disabled initially, enabled only in VR? Actually we want it interactive in non-VR too */
        }
        
        /* Make iframe interactive in non-VR mode */
        body:not(.vr-mode) .iframe-container iframe {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-logo">🚀 VR Puter</div>
        <div>Loading WebXR Environment...</div>
        <div class="loading-spinner"></div>
        <div style="margin-top: 20px; font-size: 14px; opacity: 0.8;">Preparing your cloud desktop</div>
    </div>

    <!-- VR Entry Button -->
    <button class="enter-vr-btn" id="enterVRBtn">
        🥽 ENTER VR MODE
    </button>

    <!-- Instructions -->
    <div class="instructions" id="instructions">
        👆 Click the VR button above to start • Puter desktop loads below
    </div>

    <!-- Puter Iframe (visible outside VR as preview) -->
    <div class="iframe-container" id="iframeContainer">
        <iframe 
            id="puter-iframe"
            src="https://puter.com/" 
            allow="camera; microphone; clipboard-read; clipboard-write;"
            sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads allow-presentation">
        </iframe>
    </div>

    <!-- A-Frame Scene (will cover iframe when in VR) -->
    <a-scene id="scene"
             background="color: #111111"
             vr-mode-ui="enabled: true; enterVRButton: #enterVRBtn; cardboardModeEnabled: true;"
             cursor="rayOrigin: mouse; fuse: true; fuseTimeout: 1000"
             raycaster="objects: .clickable"
             device-orientation-permission-ui="enabled: true"
             embedded
             style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; pointer-events: none;"
             class="vr-scene">

        <!-- Camera rig -->
        <a-entity id="camera-rig" position="0 1.6 3">
            <a-camera id="camera" look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>
        </a-entity>

        <!-- Lighting -->
        <a-light type="ambient" color="#445566"></a-light>
        <a-light type="point" intensity="1.5" position="0 3 2"></a-light>

        <!-- Environment (simple dark room) -->
        <a-sky color="#1a1a2e"></a-sky>
        
        <a-circle position="0 -0.5 -2" rotation="-90 0 0" radius="10" 
                  color="#2a2a4a" opacity="0.5" transparent="true"></a-circle>

        <!-- MAIN VR SCREEN - This will display Puter in VR -->
        <a-entity id="vr-screen-container" position="0 2 -2.5">
            <!-- Screen frame -->
            <a-box position="0 0 0" width="6.8" height="4.8" depth="0.3" color="#222222"></a-box>
            <a-box position="0 0 0.2" width="6.5" height="4.5" depth="0.1" color="#000000"></a-box>
            
            <!-- Screen surface (where iframe would ideally go) -->
            <a-plane id="screen-surface" 
                     position="0 0 0.3" 
                     width="6.3" height="4.3" 
                     color="#ffffff"
                     material="emissive: #333333; side: double">
            </a-plane>
            
            <!-- Placeholder text (since iframe can't render in WebGL) -->
            <a-text value="PUTER CLOUD DESKTOP" position="0 1 0.4" align="center" color="#4CAF50" scale="0.4 0.4 0.4" width="10"></a-text>
            <a-text value="Running in browser tab" position="0 0.3 0.4" align="center" color="#cccccc" scale="0.3 0.3 0.3" width="12"></a-text>
            <a-text value="↓ Look below for interactive version ↓" position="0 -0.5 0.4" align="center" color="#ffaa00" scale="0.25 0.25 0.25" width="14"></a-text>
            
            <!-- Simulated browser chrome -->
            <a-box position="0 2.2 0.3" width="6.3" height="0.4" depth="0.05" color="#2d2d2d"></a-box>
            <a-text value="https://puter.com" position="0 2.2 0.4" align="center" color="#4CAF50" scale="0.2 0.2 0.2" width="20"></a-text>
            
            <!-- Window buttons -->
            <a-sphere position="-2.8 2.2 0.4" radius="0.08" color="#FF5F56"></a-sphere>
            <a-sphere position="-2.5 2.2 0.4" radius="0.08" color="#FFBD2E"></a-sphere>
            <a-sphere position="-2.2 2.2 0.4" radius="0.08" color="#27C93F"></a-sphere>
        </a-entity>

        <!-- Floating label -->
        <a-entity position="0 0.5 -1.5">
            <a-text value="Puter Cloud OS" align="center" color="#4CAF50" scale="0.5 0.5 0.5" width="6"></a-text>
        </a-entity>

        <!-- Gaze cursor for Cardboard -->
        <a-entity id="cursor"
                  cursor="fuse: true; fuseTimeout: 1000"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: #4CAF50; shader: flat"
                  scale="0.5 0.5 0.5"
                  raycaster="objects: .clickable">
            <a-animation attribute="scale" begin="fusing" end="fusing-done" 
                         from="0.5 0.5 0.5" to="0.2 0.2 0.2" dur="1000"></a-animation>
        </a-entity>
    </a-scene>

    <script>
        // Hide loading screen after 3 seconds
        setTimeout(() => {
            document.getElementById('loading-screen').classList.add('hidden');
        }, 3000);

        const scene = document.getElementById('scene');
        const iframeContainer = document.getElementById('iframeContainer');
        const iframe = document.getElementById('puter-iframe');
        const instructions = document.getElementById('instructions');
        const body = document.body;

        // Function to update UI based on VR mode
        function updateForVRMode(isVR) {
            if (isVR) {
                // In VR mode: hide the iframe container, show VR scene
                iframeContainer.style.opacity = '0';
                iframeContainer.style.pointerEvents = 'none';
                scene.style.pointerEvents = 'auto';
                instructions.innerHTML = '🔍 Look at screen • Gaze to "click" (simulated)';
                body.classList.add('vr-mode');
            } else {
                // Non-VR mode: show iframe for interactive browsing
                iframeContainer.style.opacity = '1';
                iframeContainer.style.pointerEvents = 'auto';
                scene.style.pointerEvents = 'none';
                instructions.innerHTML = '👆 Use Puter below • Click VR button for immersive mode';
                body.classList.remove('vr-mode');
            }
        }

        // Listen for VR mode events
        scene.addEventListener('enter-vr', function() {
            console.log('Entered VR mode');
            updateForVRMode(true);
            
            // Optional: Try to communicate with iframe to pause heavy animations
            try {
                iframe.contentWindow.postMessage({ type: 'VR_MODE_ACTIVE', active: true }, '*');
            } catch(e) {}
        });

        scene.addEventListener('exit-vr', function() {
            console.log('Exited VR mode');
            updateForVRMode(false);
            
            try {
                iframe.contentWindow.postMessage({ type: 'VR_MODE_ACTIVE', active: false }, '*');
            } catch(e) {}
        });

        // Handle iframe load
        iframe.addEventListener('load', function() {
            console.log('Puter iframe loaded');
            
            // Try to inject a small style to make it more VR-friendly (optional)
            try {
                iframe.contentWindow.postMessage({ 
                    type: 'VR_DESKTOP_READY', 
                    message: 'You can use Puter normally here. Click VR button for immersive mode.'
                }, '*');
            } catch(e) {}
        });

        // Click handler for the simulated screen in VR
        document.getElementById('screen-surface')?.addEventListener('click', function() {
            if (scene.is('vr-mode')) {
                alert('💡 In VR mode, Puter runs in the main browser tab.\n\nExit VR mode (tap screen or press ESC) to use Puter interactively, then re-enter VR to view it on the big screen!');
            }
        });

        // Add clickable class to screen surface for cursor
        document.getElementById('screen-surface')?.setAttribute('class', 'clickable');

        // Initial state
        updateForVRMode(false);

        // Handle browser resize
        window.addEventListener('resize', function() {
            // Iframe already responsive, just ensure scene updates
            if (scene.renderer && scene.renderer.setSize) {
                scene.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
