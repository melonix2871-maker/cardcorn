<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Cloud Desktop - Google Cardboard</title>
    
    <!-- A-Frame script in HEAD (fixes the warning) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* Loading screen */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 2000; transition: opacity 1s;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* VR button */
        .enter-vr-btn {
            position: fixed; bottom: 30px; right: 30px;
            background: #4CAF50; color: white;
            border: 3px solid white; padding: 15px 30px;
            border-radius: 50px; font-size: 18px; font-weight: bold;
            cursor: pointer; z-index: 100;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px #4CAF50; }
            50% { transform: scale(1.05); box-shadow: 0 0 40px #4CAF50; }
        }
        
        /* Iframe container */
        .iframe-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 50;
        }
        .iframe-container iframe {
            width: 100%; height: 100%; border: none;
        }
        
        /* Instructions */
        .instructions {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px 20px; border-radius: 30px;
            z-index: 150; border: 1px solid #4CAF50;
            white-space: nowrap; pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div style="font-size: 48px; margin-bottom: 20px;">🚀 VR Cloud Desktop</div>
        <div>Loading WebXR Environment...</div>
        <div class="loading-spinner"></div>
    </div>

    <!-- VR Button -->
    <button class="enter-vr-btn" id="enterVRBtn">🥽 ENTER VR MODE</button>
    <div class="instructions" id="instructions">👆 Click VR button for immersive mode • OS.js desktop below</div>

    <!-- OS.js Iframe (embeddable cloud OS) -->
    <div class="iframe-container" id="iframeContainer">
        <iframe 
            id="osjs-iframe"
            src="https://demo.os-js.org/"
            allow="camera; microphone; clipboard-read; clipboard-write;">
        </iframe>
    </div>

    <!-- A-Frame Scene -->
    <a-scene id="scene"
             background="color: #111111"
             vr-mode-ui="enabled: true; enterVRButton: #enterVRBtn;"
             cursor="rayOrigin: mouse; fuse: true; fuseTimeout: 1000"
             raycaster="objects: .clickable"
             device-orientation-permission-ui="enabled: true"
             embedded
             style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; pointer-events: none;">

        <!-- Camera -->
        <a-entity id="camera-rig" position="0 1.6 3">
            <a-camera id="camera" look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>
        </a-entity>

        <!-- Lighting (updated for Three.js r155+) -->
        <a-light type="ambient" color="#445566" intensity="1.5"></a-light>
        <a-light type="point" intensity="2.0" position="0 3 2" decay="2"></a-light>
        <a-light type="directional" intensity="1.2" position="-1 2 1"></a-light>

        <!-- Environment -->
        <a-sky color="#1a1a2e"></a-sky>
        <a-circle position="0 -0.5 -2" rotation="-90 0 0" radius="10" 
                  color="#2a2a4a" opacity="0.5" transparent="true"></a-circle>

        <!-- VR Screen -->
        <a-entity id="vr-screen-container" position="0 2 -2.5">
            <a-box position="0 0 0" width="6.8" height="4.8" depth="0.3" color="#222222"></a-box>
            <a-box position="0 0 0.2" width="6.5" height="4.5" depth="0.1" color="#000000"></a-box>
            
            <!-- Screen surface -->
            <a-plane id="screen-surface" class="clickable"
                     position="0 0 0.3" width="6.3" height="4.3" 
                     color="#ffffff" material="emissive: #333333; side: double">
            </a-plane>
            
            <!-- OS.js info text -->
            <a-text value="OS.js CLOUD DESKTOP" position="0 1.2 0.4" align="center" color="#4CAF50" scale="0.3 0.3 0.3" width="12"></a-text>
            <a-text value="Interactive in main window" position="0 0.5 0.4" align="center" color="#cccccc" scale="0.2 0.2 0.2" width="14"></a-text>
            <a-text value="↓ Use desktop below ↓" position="0 -0.3 0.4" align="center" color="#ffaa00" scale="0.2 0.2 0.2" width="12"></a-text>
            
            <!-- Browser chrome -->
            <a-box position="0 2.2 0.3" width="6.3" height="0.4" depth="0.05" color="#2d2d2d"></a-box>
            <a-text value="https://demo.os-js.org" position="0 2.2 0.4" align="center" color="#4CAF50" scale="0.15 0.15 0.15" width="25"></a-text>
        </a-entity>

        <!-- Gaze cursor -->
        <a-entity id="cursor"
                  cursor="fuse: true; fuseTimeout: 1000"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: #4CAF50; shader: flat"
                  scale="0.5 0.5 0.5"
                  raycaster="objects: .clickable">
            <a-animation attribute="scale" begin="fusing" end="fusing-done" 
                         from="0.5 0.5 0.5" to="0.2 0.2 0.2" dur="1000"></a-animation>
        </a-entity>
    </a-scene>

    <script>
        // Hide loading screen
        setTimeout(() => {
            document.getElementById('loading-screen').classList.add('hidden');
        }, 3000);

        const scene = document.getElementById('scene');
        const iframeContainer = document.getElementById('iframeContainer');
        const instructions = document.getElementById('instructions');

        // Handle VR mode
        scene.addEventListener('enter-vr', () => {
            iframeContainer.style.opacity = '0';
            iframeContainer.style.pointerEvents = 'none';
            scene.style.pointerEvents = 'auto';
            instructions.innerHTML = '🔍 Look at screen • Gaze to interact (simulated)';
        });

        scene.addEventListener('exit-vr', () => {
            iframeContainer.style.opacity = '1';
            iframeContainer.style.pointerEvents = 'auto';
            scene.style.pointerEvents = 'none';
            instructions.innerHTML = '👆 Use OS.js desktop below • Click VR button for immersive mode';
        });

        // Click handler for screen
        document.getElementById('screen-surface')?.addEventListener('click', () => {
            if (scene.is('vr-mode')) {
                alert('💡 OS.js runs in the main browser tab.\n\nExit VR mode to use it interactively, then re-enter VR to view on the big screen!');
            }
        });

        // Initial state
        scene.style.pointerEvents = 'none';
    </script>
</body>
</html>
